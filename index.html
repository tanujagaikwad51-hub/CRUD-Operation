<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUD Operation</title>

    <link rel="stylesheet" href="style.css">
</head>

<body onload="readAll()">

    <div class="container">

        <div class="form_container">

            <!-- Create Form -->
            <form class="create_form">

                <input 
                    type="text" 
                    class="name" 
                    placeholder="Enter Name"
                >

                <input 
                    type="email" 
                    class="email" 
                    placeholder="Enter Email"
                >

                <button type="button" onclick="add()">
                    Create
                </button>

            </form>


            <!-- Update Form -->
            <form class="update_form" style="display: none;">

                <input 
                    type="hidden" 
                    class="id"
                >

                <input 
                    type="text" 
                    class="uname" 
                    placeholder="Enter Name"
                >

                <input 
                    type="email" 
                    class="uemail" 
                    placeholder="Enter Email"
                >

                <button type="button" onclick="update()">
                    Update
                </button>

            </form>


            <!-- Add Button -->
            <div class="add_div" style="display: none;">

                <button type="button" onclick="create()">
                    Add +
                </button>

            </div>


            <!-- Data Table -->
            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody class="data_table">
                </tbody>

            </table>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="./Crude.js"></script>

</body>

</html>
